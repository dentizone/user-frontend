<div class="relative flex flex-col w-full bg-white rounded-xl shadow-lg hover:shadow-xl hover:scale-105 transition-transform duration-200 overflow-hidden group">
  <!-- Favorite Icon -->
  <button
    type="button"
    (click)="onSelectFav(product.id)"
    class="absolute top-3 right-3 z-10 p-2 bg-white/80 border border-gray-200 shadow rounded-full hover:bg-blue-50 text-blue-600 transition-colors duration-200"
    aria-label="Add to favorites"
  >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
      <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
    </svg>
  </button>
  <!-- Image -->
  <a [routerLink]="['/post', product.id]" class="aspect-w-1 aspect-h-1 w-full bg-gray-100 overflow-hidden flex items-center justify-center block">
    <img
      class="object-cover w-full h-full transition-transform duration-300 group-hover:scale-105 rounded-t-xl cursor-pointer"
      [src]="product.assets[0]?.url || product.imagesrc"
      alt="product"
      loading="lazy"
    />
  </a>
  <!-- Content -->
  <div class="flex flex-col flex-1 px-4 pt-3 pb-4">
    <a [routerLink]="['/post', product.id]" class="block mb-1">
      <h5 class="text-lg font-bold text-gray-900 line-clamp-2">{{product.title}}</h5>
    </a>
    <div class="text-gray-500 text-sm mb-3 line-clamp-2 min-h-[2.5em]">
      <quill-view-html [content]="getFirstLines(product.description)" theme="snow"></quill-view-html>
    </div>
    <div class="flex items-end justify-between mt-auto">
      <span class="text-xl font-bold text-blue-700">{{product.price}} EGP</span>
      <button
        type="button"
        (click)="onAddToCart(product.id)"
        class="ml-2 p-2 rounded-full bg-blue-600 text-white shadow-lg hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-300 transition-colors duration-200 flex items-center justify-center"
        aria-label="Add to cart"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
        </svg>
      </button>
    </div>
  </div>
</div>
