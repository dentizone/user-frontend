<nav class="bg-white">
  <div
    class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4"
  >
    <a routerLink="/" class="flex items-center space-x-3 rtl:space-x-reverse">
      <img
        src="/assets/logo/logoWithoutBackground.png"
        class="h-12"
        alt="Dentizone Logo"
      />
    </a>
    <div
      class="flex items-center md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse"
    >
      <a
        *ngIf="!authService.isAuthenticated()"
        routerLink="/auth/login"
        class="flex items-center py-2 px-5 mx-3.5 font-bold rounded-full bg-blue-600 text-white hover:bg-blue-700 transition-colors duration-200 shadow focus:ring-2 focus:ring-blue-300 border-none outline-none"
        style="min-width: 120px; justify-content: center; gap: 0.5rem"
      >
        <img
          src="/assets/Icons/padlock.png"
          class="w-5 h-5"
          alt="Padlock icon"
        />
        <span>Join Us</span>
      </a>

      <div class="relative" *ngIf="authService.isAuthenticated()">
        <button
          type="button"
          class="flex text-sm bg-gray-800 rounded-full md:me-0 focus:ring-4 focus:ring-gray-300"
          id="user-menu-button"
          aria-expanded="false"
          data-dropdown-toggle="user-dropdown"
          data-dropdown-placement="bottom"
          (click)="opendropdown()"
        >
          <img
            class="w-8 h-8 rounded-full"
            src="/assets/Profile/user.png"
            alt="user photo"
          />
        </button>
        <div
          class="z-50 absolute right-0 mt-2 w-56 text-base list-none bg-white divide-y divide-gray-100 rounded-xl shadow-2xl border border-gray-200"
          id="user-dropdown"
          [ngClass]="{ block: opened, hidden: !opened }"
        >
          <div
            class="px-4 py-4 bg-blue-300 rounded-t-xl flex items-center gap-3"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-8 h-8 text-blue-700 bg-white rounded-full p-1 border border-blue-200"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 7.5a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4.5 19.5a7.5 7.5 0 1115 0v.75a.75.75 0 01-.75.75H5.25a.75.75 0 01-.75-.75V19.5z"
              />
            </svg>
            <span class="block text-lg font-semibold text-gray-900">{{
              user?.fullName || UserName
            }}</span>
          </div>
          <ul class="py-2" aria-labelledby="user-menu-button">
            <li>
              <a
                routerLink="/profile"
                class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 transition-colors duration-150 rounded-md"
                (click)="closeDropdown()"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-5 h-5 text-blue-600"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15.75 7.5a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M4.5 19.5a7.5 7.5 0 1115 0v.75a.75.75 0 01-.75.75H5.25a.75.75 0 01-.75-.75V19.5z"
                  />
                </svg>
                Profile
              </a>
            </li>
            <li>
              <a
                routerLink="/profile/fav-list"
                class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 transition-colors duration-150 rounded-md"
                (click)="closeDropdown()"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-5 h-5 text-pink-500"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M21 8.25c0-2.485-2.239-4.5-5-4.5-1.657 0-3.156.832-4 2.086A4.978 4.978 0 007 3.75c-2.761 0-5 2.015-5 4.5 0 7.25 10 11 10 11s10-3.75 10-11z"
                  />
                </svg>
                Favorite List
              </a>
            </li>
            <li>
              <a
                routerLink="/cart"
                class="flex items-center gap-2 px-4 py-2 text-sm text-gray-700 hover:bg-blue-50 transition-colors duration-150 rounded-md"
                (click)="closeDropdown()"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-5 h-5 text-green-600"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.25 3h1.386a.75.75 0 01.728.546l.347 1.385m2.25 9.75h9.708a.75.75 0 00.728-.546l3.172-12.69A.75.75 0 0019.5 1.5H6.75a.75.75 0 00-.728.546l-3.172 12.69a.75.75 0 00.728.954h1.386m2.25 0a2.25 2.25 0 104.5 0m-4.5 0a2.25 2.25 0 104.5 0"
                  />
                </svg>
                Cart
              </a>
            </li>
            <li>
              <a
                (click)="logout()"
                class="flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors duration-150 rounded-md cursor-pointer"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-5 h-5 text-red-600"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6A2.25 2.25 0 005.25 5.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M18 12h-9m0 0l3-3m-3 3l3 3"
                  />
                </svg>
                Sign out
              </a>
            </li>
          </ul>
        </div>
      </div>
      <button
        data-collapse-toggle="navbar-user"
        type="button"
        class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200"
        aria-controls="navbar-user"
        aria-expanded="false"
        (click)="toggleMobileMenu()"
      >
        <span class="sr-only">Open main menu</span>
        <svg
          class="w-5 h-5"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 17 14"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M1 1h15M1 7h15M1 13h15"
          />
        </svg>
      </button>
    </div>
    <div
      class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1 text-black"
      id="navbar-user"
      [ngClass]="{ hidden: !mobileMenuOpened, block: mobileMenuOpened }"
    >
      <ul
        class="flex flex-col font-medium p-4 md:p-0 mt-4 border rounded-lg md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-white"
      >
        <li>
          <a
            routerLink="/"
            [class]="
              isActive('/')
                ? 'block py-2 px-3 text-blue-900 font-bold bg-blue-50 rounded-md md:bg-blue-50 md:text-blue-900 md:font-bold md:p-2'
                : 'block py-2 px-3 text-black rounded-md hover:bg-blue-50 hover:text-blue-900 md:hover:bg-blue-50 md:hover:text-blue-900 md:p-2'
            "
            aria-current="page"
          >
            Home
          </a>
        </li>
        <li>
          <a
            routerLink="/catalog"
            [class]="
              isActive('/marketplace')
                ? 'block py-2 px-3 text-blue-900 font-bold bg-blue-50 rounded-md md:bg-blue-50 md:text-blue-900 md:font-bold md:p-2'
                : 'block py-2 px-3 text-black rounded-md hover:bg-blue-50 hover:text-blue-900 md:hover:bg-blue-50 md:hover:text-blue-900 md:p-2'
            "
          >
            Marketplace
          </a>
        </li>
        <li>
          <a
            routerLink="/about"
            [class]="
              isActive('/about')
                ? 'block py-2 px-3 text-blue-900 font-bold bg-blue-50 rounded-md md:bg-blue-50 md:text-blue-900 md:font-bold md:p-2'
                : 'block py-2 px-3 text-black rounded-md hover:bg-blue-50 hover:text-blue-900 md:hover:bg-blue-50 md:hover:text-blue-900 md:p-2'
            "
          >
            About
          </a>
        </li>
        <li>
          <a
            routerLink="/services"
            [class]="
              isActive('/services')
                ? 'block py-2 px-3 text-blue-900 font-bold bg-blue-50 rounded-md md:bg-blue-50 md:text-blue-900 md:font-bold md:p-2'
                : 'block py-2 px-3 text-black rounded-md hover:bg-blue-50 hover:text-blue-900 md:hover:bg-blue-50 md:hover:text-blue-900 md:p-2'
            "
          >
            Services
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
