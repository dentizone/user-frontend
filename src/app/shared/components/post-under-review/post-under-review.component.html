<div class="flex justify-center items-center min-h-[60vh] bg-white rounded-xl shadow-lg my-10 border border-gray-100">
  <div class="text-center px-8 py-12 w-full max-w-xl">
    <div class="flex justify-center mb-6">
      <div class="bg-blue-50 p-4 rounded-full border-4 border-blue-100 animate-[pulse_3s_ease-in-out_infinite]">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-16 h-16 text-blue-600">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
        </svg>
      </div>
    </div>
    <h2 class="text-gray-900 text-3xl font-bold mb-4">Your Post Is Under Review</h2>
    <p class="text-gray-600 text-lg mb-8">
      Thank you for your submission. Our team will review your post and get back to you soon.
    </p>
    <button
      class="bg-blue-600 hover:bg-blue-800 text-white text-xl font-bold rounded-xl px-10 py-3 transition-colors duration-200 shadow-lg focus:outline-none focus:ring-2 focus:ring-blue-300"
      (click)="backToHome()"
    >
      Back To Home
    </button>
  </div>
</div>
