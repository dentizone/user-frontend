<div class="container mx-auto px-4">
  <h5 class="text-2xl md:text-3xl font-bold tracking-tight text-black mb-8">
    Recent Feedback
  </h5>
  <owl-carousel-o [options]="customOptions">
    @for (item of usersFeedback; track item.id) {
    <ng-template carouselSlide [id]="item.id">
      <div
        class="relative flex flex-col items-center justify-between px-8 py-10 rounded-2xl shadow-xl bg-white/80 border border-white/40 overflow-hidden animate__animated animate__fadeIn backdrop-blur-md transition-transform duration-300 hover:scale-105"
      >
        <span
          class="absolute top-4 left-4 text-4xl text-blue-200 opacity-60 select-none"
          >&#10077;</span
        >
        <h5
          class="text-xl font-bold text-gray-900 mb-2 tracking-wide w-full text-center"
        >
          {{ item.UserName }}
        </h5>
        <div class="mb-4 flex justify-center w-full gap-1">
          @for (star of [1,2,3,4,5]; track star) {
          <svg
            *ngIf="star <= item.rating"
            xmlns="http://www.w3.org/2000/svg"
            fill="#FFD700"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="#FFD700"
            class="w-8 h-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"
            />
          </svg>
          <svg
            *ngIf="star > item.rating"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="#FFD700"
            class="w-8 h-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"
            />
          </svg>
          }
        </div>
        <p
          class="text-base text-gray-700 text-center font-medium leading-relaxed mb-2 px-2"
        >
          {{ item.feedback }}
        </p>
      </div>
    </ng-template>
    }
  </owl-carousel-o>
</div>
