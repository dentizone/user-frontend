<div class="max-w-5xl mx-auto p-6 space-y-6">
    <div>
        <h2 class="text-2xl font-bold text-gray-800">Wallet Dashboard</h2>
        <p class="text-sm text-gray-500">Manage your funds and withdrawals</p>
    </div>

 
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    
        <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg shadow-sm">
            <div class="text-sm text-blue-800 font-medium">Current Balance</div>
            <div class="text-2xl font-bold text-blue-900 mt-2">EGP {{ currentBalance }}</div>
            <p class="text-xs text-gray-500 mt-1">Available for withdrawal</p>
        </div>

      
        <div class="bg-yellow-50 border border-yellow-200 p-4 rounded-lg shadow-sm">
            <div class="text-sm text-yellow-800 font-medium">Pending Balance</div>
            <div class="text-2xl font-bold text-yellow-900 mt-2">EGP {{ pendingBalance }}</div>
            <p class="text-xs text-gray-500 mt-1">Processing in 2–3 business days</p>
        </div>

    
        <div class="bg-green-50 border border-green-200 p-4 rounded-lg shadow-sm">
            <div class="text-sm text-green-800 font-medium">Total Revenue</div>
            <div class="text-2xl font-bold text-green-900 mt-2">EGP {{ totalRevenue }}</div>
            <p class="text-xs text-gray-500 mt-1">Lifetime earnings</p>
        </div>
    </div>

 
    <div class="bg-white border border-gray-200 p-6 rounded-lg shadow space-y-4">
        <div class="text-lg font-semibold text-gray-800">Withdraw Funds</div>

        <div>
            <label for="withdraw-amount" class="block text-sm font-medium text-gray-600 mb-1">Enter amount to
                withdraw</label>
            <input type="number" id="withdraw-amount" [(ngModel)]="withdrawAmount"
                class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-blue-300"
                placeholder="eg:1000 EGP" min="100" />

            <button class="bg-blue-600 text-white px-6 py-2 rounded shadow hover:bg-blue-700 transition mt-2 w-full"
                (click)="submitWithdrawal()">
                Submit Request
            </button>
        </div>
    </div>
