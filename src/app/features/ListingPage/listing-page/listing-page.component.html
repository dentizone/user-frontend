<div class="flex flex-col justify-center items-center">
  <h1 class="font-bold text-3xl mb-3">Dental Lab / Materials</h1>
  <div class="w-11/12 justify-center items-center bg-white border border-gray-200 rounded-lg shadow-sm">
    <div class="grid gap-6 lg:grid-cols-3 md:grid-cols-2 grid-cols-1 p-4 bg-white rounded-lg md:p-8">
      @for (item of clinicalproduct; track $index) {
        <app-product-card [product]="item"></app-product-card>
      }
    </div>
    <div class="justify-center items-center flex mb-5">
      <nav class="flex items-center space-x-2">
        <button class="text-gray-500" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">Prev</button>
        <ng-container *ngFor="let page of pages">
          <button class="w-8 h-8 rounded-full border text-black" [ngClass]="{'bg-blue-600 text-white border-blue-600': page === currentPage, 'hover:bg-blue-100': page !== currentPage}" (click)="goToPage(page)">{{ page }}</button>
        </ng-container>
        <button class="text-gray-500" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">Next</button>
      </nav>
    </div>
  </div>
</div>
