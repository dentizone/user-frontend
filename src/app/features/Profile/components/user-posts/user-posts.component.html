<div class="w-full mx-auto py-8">
  <div
    *ngIf="Current.length === 0"
    class="flex flex-col justify-center items-center bg-blue-100 w-5/6 p-8 rounded-2xl mx-auto mt-12 mb-8 text-center border-2 border-dashed border-[#0077B6]"
  >
    <h4 class="text-2xl font-semibold mb-2">No Posts Yet</h4>
    <p class="capitalize mb-4">Go to add your first Post</p>
    <button
      routerLink="/add-new-post"
      class="font-semibold bg-[#0077B6] px-6 py-2 rounded-2xl text-xl text-white shadow hover:bg-[#005f87] transition-all duration-200 mt-2"
    >
      Add New Post
    </button>
  </div>
  <div
    *ngIf="Current.length > 0"
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 justify-items-center mt-8"
  >
    <div
      *ngFor="let item of Current; trackBy: trackById"
      class="w-full max-w-sm flex flex-col justify-between bg-white border border-gray-200 rounded-2xl shadow-lg overflow-hidden p-6 hover:shadow-2xl transition-all duration-200 min-h-[350px]"
    >
      <div class="relative w-full h-40 mb-4">
        <button
          type="button"
          class="absolute top-2 right-2 z-10 p-1 bg-white border border-gray-300 cursor-pointer hover:bg-gray-200 rounded-full transition-colors duration-200"
          aria-label="Edit product"
          (click)="onEditPost(item.id)"
        >
          <img src="/assets/Icons/edit.png" class="w-5 h-5" alt="edit" />
        </button>
        <img
          class="w-full h-full object-cover rounded-xl"
          [src]="item.assets[0].url"
          alt="product"
        />
      </div>
      <div class="flex flex-col flex-grow px-2 py-2">
        <h5 class="text-xl font-semibold tracking-tight text-gray-900 mb-2">
          {{ item.title }}
        </h5>
        <p class="text-sm text-gray-600 mb-4">{{ item.description }}</p>
        <div class="mt-auto text-right">
          <span class="text-xl font-bold text-[#0077B6]"
            >{{ item.price }} EGP</span
          >
        </div>
      </div>
    </div>
  </div>
  <button
    *ngIf="Current.length > 0"
    (click)="onAddNewPost()"
    class="fixed bottom-8 right-8 z-50 bg-[#0077B6] hover:bg-[#005f87] text-white rounded-full shadow-lg w-16 h-16 flex items-center justify-center text-3xl transition-all duration-200"
    aria-label="Add New Post"
  >
    +
  </button>
</div>
