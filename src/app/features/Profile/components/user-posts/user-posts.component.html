<div class="w-full mx-auto py-8">
  <div
    *ngIf="Current.length === 0"
    class="flex flex-col justify-center items-center bg-blue-100 w-5/6 p-8 rounded-2xl mx-auto mt-12 mb-8 text-center border-2 border-dashed border-[#0077B6]"
  >
    <h4 class="text-2xl font-semibold mb-2">No Posts Yet</h4>
    <p class="capitalize mb-4">Go to add your first Post</p>
    <button
      routerLink="/add-new-post"
      class="font-semibold bg-[#0077B6] px-6 py-2 rounded-2xl text-xl text-white shadow hover:bg-[#005f87] transition-all duration-200 mt-2"
    >
      Add New Post
    </button>
  </div>
  <div
    *ngIf="Current.length > 0"
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 lg:gap-8 px-4 mt-8"
  >
    <div
      *ngFor="let item of Current; trackBy: trackById"
      class="w-full max-w-sm bg-white border border-gray-200 rounded-2xl shadow-lg overflow-hidden p-4 hover:shadow-2xl transition-all duration-200 min-h-[450px] mx-auto"
    >
      <div class="relative w-full h-40 mb-3">
        <button
          type="button"
          class="absolute top-2 right-2 z-10 p-1 bg-white border border-gray-300 cursor-pointer hover:bg-gray-200 rounded-full transition-colors duration-200"
          aria-label="Edit product"
          (click)="onEditPost(item.id)"
        >
          <img src="/assets/Icons/edit.png" class="w-5 h-5" alt="edit" />
        </button>
        <div class="absolute top-2 left-2 z-10 px-2 py-1 bg-white bg-opacity-80 rounded-lg text-xs font-medium">
          <span [ngClass]="{
            'text-green-600': item.status === 'Active',
            'text-yellow-600': item.status === 'Pending',
            'text-red-600': item.status === 'Inactive'
          }">{{ item.status }}</span>
        </div>
        <img
          class="w-full h-full object-cover rounded-xl"
          [src]="(item.assets && item.assets.length > 0) ? item.assets[0].url : '/assets/items/image1.png'"
          alt="product"
        />
      </div>
      <div class="flex flex-col  px-1">
        <div class="flex justify-between items-start mb-1">
          <h5 class="text-lg font-semibold tracking-tight text-gray-900 flex-grow truncate">
            {{ item.title }}
          </h5>
          <span class="text-lg font-bold text-[#0077B6] whitespace-nowrap ml-2">
            {{ item.price }} EGP
          </span>
        </div>
        
        <div class="flex flex-wrap gap-2 mb-2">
          <span class="bg-blue-100 text-blue-800 text-xs font-medium px-2 py-0.5 rounded-full">{{ item.category }}</span>
          <span class="bg-purple-100 text-purple-800 text-xs font-medium px-2 py-0.5 rounded-full">{{ item.subCatgory }}</span>
          <span class="bg-gray-100 text-gray-800 text-xs font-medium px-2 py-0.5 rounded-full">{{ item.condition }}</span>
        </div>
        
        <div class="text-sm text-gray-600 mb-3 relative">
          <div class="ql-container ql-snow border-0">
            <div class="ql-editor p-0 max-h-20 overflow-hidden" [innerHTML]="trimQuillContent(item.description)"></div>
            <div class="absolute bottom-0 left-0 right-0 h-6 bg-gradient-to-t from-white to-transparent"></div>
          </div>
        </div>
        
      
    </div>
  </div>
  <button
    *ngIf="Current.length > 0"
    (click)="onAddNewPost()"
    class="fixed bottom-8 right-8 z-50 bg-[#0077B6] hover:bg-[#005f87] text-white rounded-full shadow-lg w-16 h-16 flex items-center justify-center text-3xl transition-all duration-200"
    aria-label="Add New Post"
  >
    +
  </button>
</div>
