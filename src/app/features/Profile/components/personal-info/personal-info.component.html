<div
  class="flex flex-col lg:flex-row mt-8 bg-white space-x-5 p-4 rounded-2xl border border-gray-300 shadow-md mb-5 w-full justify-self-center items-center"
>
  <div class="rounded-full w-24 float-left bg-[#3BA3DB]">
    <img [src]="avatarSrc" class="bg-cover" alt="Avatar" />
  </div>
  <div>
    <div
      class="flex flex-col lg:flex-row justify-center items-center min-h-full"
    >
      <h3 class="font-bold text-2xl">{{ userName }}</h3>
      <span class="text-gray-600 ms-4 flex"
        ><span>&commat;</span> {{ generatedName }}</span
      >
      <span
        [ngClass]="
          verificationBadgeColor +
          ' font-semibold mt-2 lg:mt-0 flex ms-4 rounded-xl px-3 py-1 capitalize'
        "
      >
        <!-- Heroicons SVGs for each status -->
        <ng-container [ngSwitch]="verificationBadgeText">
          <!-- Pending Verification -->
          <svg
            *ngSwitchCase="'Pending Verification'"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6 mr-1"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 6v6l4 2"
            />
            <circle
              cx="12"
              cy="12"
              r="9"
              stroke="currentColor"
              stroke-width="1.5"
              fill="none"
            />
          </svg>
          <!-- Verification In Progress -->
          <svg
            *ngSwitchCase="'Verification In Progress'"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6 mr-1"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 6v6l4 2"
            />
            <circle
              cx="12"
              cy="12"
              r="9"
              stroke="currentColor"
              stroke-width="1.5"
              fill="none"
            />
          </svg>
          <!-- Verified -->
          <svg
            *ngSwitchCase="'Verified'"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6 mr-1"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4.5 12.75l6 6 9-13.5"
            />
          </svg>
          <!-- Rejected -->
          <svg
            *ngSwitchCase="'Rejected'"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6 mr-1"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
          <!-- Suspended -->
          <svg
            *ngSwitchCase="'Suspended'"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6 mr-1"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 6v6l4 2"
            />
            <circle
              cx="12"
              cy="12"
              r="9"
              stroke="currentColor"
              stroke-width="1.5"
              fill="none"
            />
          </svg>
          <!-- Expired -->
          <svg
            *ngSwitchCase="'Verification Expired'"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6 mr-1"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 6v6l4 2"
            />
            <circle
              cx="12"
              cy="12"
              r="9"
              stroke="currentColor"
              stroke-width="1.5"
              fill="none"
            />
          </svg>
          <!-- Cancelled -->
          <svg
            *ngSwitchCase="'Verification Cancelled'"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6 mr-1"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
          <!-- Unverified/default -->
          <svg
            *ngSwitchDefault
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6 mr-1"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 6v6l4 2"
            />
            <circle
              cx="12"
              cy="12"
              r="9"
              stroke="currentColor"
              stroke-width="1.5"
              fill="none"
            />
          </svg>
        </ng-container>
        {{ verificationBadgeText }}
      </span>
    </div>
    <p class="text-gray-600 mt-2 ms-2">{{ userUniversity }}</p>
    <div class="flex mt-2">
      <span class="flex space-x-2 font-semibold">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="mr-2"
          viewBox="0 0 24 24"
          width="25"
          height="25"
          fill="var(--color-blue-900)"
        >
          <path d="M12 3L2 8l10 5 10-5-10-5z" />
          <path d="M4 11v5c0 2 3.6 3.5 8 3.5s8-1.5 8-3.5v-5l-8 4-8-4z" />
          <path d="M18 8.8v4.2a2 2 0 1 0 2 0V7.8l-2 .9z" />
        </svg>

        {{ academicYear }}</span
      >
    </div>
  </div>
</div>
<!-- User Posts Section -->
<app-user-posts></app-user-posts>
