<div class="relative w-full max-w-4xl mx-auto mt-10 mb-8">
  <!-- Background mockup/illustration -->
  <div class="absolute inset-0 z-0 rounded-3xl overflow-hidden">
    <svg
      viewBox="0 0 600 200"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      class="w-full h-full"
    >
      <ellipse cx="300" cy="100" rx="300" ry="100" fill="#e0f2fe" />
      <ellipse
        cx="500"
        cy="180"
        rx="120"
        ry="30"
        fill="#bae6fd"
        fill-opacity="0.5"
      />
      <ellipse
        cx="100"
        cy="30"
        rx="80"
        ry="20"
        fill="#7dd3fc"
        fill-opacity="0.3"
      />
    </svg>
  </div>
  <div
    class="relative z-10 flex flex-col md:flex-row items-center bg-white/90 backdrop-blur-md rounded-3xl shadow-xl border border-gray-200 p-8 gap-8"
  >
    <!-- Avatar -->
    <div class="flex-shrink-0 flex flex-col items-center">
      <div
        class="w-36 h-36 rounded-full border-4 border-blue-200 shadow-lg overflow-hidden bg-gradient-to-tr from-blue-100 to-blue-300 flex items-center justify-center"
      >
        <img
          [src]="avatarSrc"
          class="object-cover w-full h-full"
          alt="Avatar"
        />
      </div>
      <span class="mt-3 text-xs text-gray-400">Profile Picture</span>
    </div>
    <!-- Info -->
    <div class="flex-1 flex flex-col justify-center gap-2">
      <div class="flex flex-col gap-1 md:gap-2">
        <h3 class="font-extrabold text-3xl text-gray-900">{{ userName }}</h3>
        <span class="text-gray-500 text-lg flex items-center"
          ><span class="mr-1">&commat;</span>{{ generatedName }}</span
        >
        <div class="flex items-center gap-4 mt-2">
          <span class="text-blue-700 text-base font-semibold flex items-center">
            <svg
              class="w-5 h-5 mr-2 text-blue-400"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17.657 16.657L13.414 12.414A6 6 0 1 0 12 18a5.978 5.978 0 0 0 4.243-1.757z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 11a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"
              />
            </svg>
            {{ userUniversity }}
          </span>
          <span class="text-gray-700 text-base flex items-center">
            <svg
              class="w-5 h-5 mr-2 text-blue-400"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 3L2 8l10 5 10-5-10-5z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 11v5c0 2 3.6 3.5 8 3.5s8-1.5 8-3.5v-5l-8 4-8-4z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M18 8.8v4.2a2 2 0 1 0 2 0V7.8l-2 .9z"
              />
            </svg>
            {{ academicYear }}
          </span>
        </div>
      </div>
      <div class="flex flex-col items-end mt-4">
        <span
          [ngClass]="
            verificationBadgeColor +
            ' font-semibold flex items-center rounded-xl px-3 py-1 capitalize text-sm'
          "
        >
          <ng-container [ngSwitch]="verificationBadgeText">
            <!-- Pending Verification -->
            <svg
              *ngSwitchCase="'Pending Verification'"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-5 h-5 mr-1"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 6v6l4 2"
              />
              <circle
                cx="12"
                cy="12"
                r="9"
                stroke="currentColor"
                stroke-width="1.5"
                fill="none"
              />
            </svg>
            <!-- Verification In Progress -->
            <svg
              *ngSwitchCase="'Verification In Progress'"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-5 h-5 mr-1"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 6v6l4 2"
              />
              <circle
                cx="12"
                cy="12"
                r="9"
                stroke="currentColor"
                stroke-width="1.5"
                fill="none"
              />
            </svg>
            <!-- Verified -->
            <svg
              *ngSwitchCase="'Verified'"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-5 h-5 mr-1"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4.5 12.75l6 6 9-13.5"
              />
            </svg>
            <!-- Rejected -->
            <svg
              *ngSwitchCase="'Rejected'"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-5 h-5 mr-1"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
            <!-- Suspended -->
            <svg
              *ngSwitchCase="'Suspended'"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-5 h-5 mr-1"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 6v6l4 2"
              />
              <circle
                cx="12"
                cy="12"
                r="9"
                stroke="currentColor"
                stroke-width="1.5"
                fill="none"
              />
            </svg>
            <!-- Expired -->
            <svg
              *ngSwitchCase="'Verification Expired'"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-5 h-5 mr-1"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 6v6l4 2"
              />
              <circle
                cx="12"
                cy="12"
                r="9"
                stroke="currentColor"
                stroke-width="1.5"
                fill="none"
              />
            </svg>
            <!-- Cancelled -->
            <svg
              *ngSwitchCase="'Verification Cancelled'"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-5 h-5 mr-1"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
            <!-- Unverified/default -->
            <svg
              *ngSwitchDefault
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="w-5 h-5 mr-1"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 6v6l4 2"
              />
              <circle
                cx="12"
                cy="12"
                r="9"
                stroke="currentColor"
                stroke-width="1.5"
                fill="none"
              />
            </svg>
          </ng-container>
          {{ verificationBadgeText }}
        </span>
        <span class="text-xs text-gray-500 mt-1 text-right w-full block">
          {{ verificationDescription }}
        </span>
      </div>
    </div>
  </div>
</div>
<!-- User Posts Section -->
<app-user-posts></app-user-posts>
