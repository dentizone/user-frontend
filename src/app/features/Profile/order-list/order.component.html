@if (isLoading) {
<div class="flex justify-center items-center py-10">
  <app-loader></app-loader>
</div>
} @else {
<div class="max-w-5xl mx-auto p-6 space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-gray-800">My Orders</h2>
    <p class="text-sm text-gray-500">Track your recent and past orders</p>
  </div>
  @if (orders?.length === 0) {
  <div
    class="flex flex-col items-center justify-center bg-white border border-gray-200 rounded-xl shadow p-8 my-12 mx-auto max-w-md"
  >
    <svg
      class="w-16 h-16 text-blue-200 mb-4"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
      />
    </svg>
    <h3 class="text-xl font-bold text-blue-900 mb-2">No Orders Yet</h3>
    <p class="text-gray-500 mb-4 text-center">
      You haven't placed any orders yet. Start exploring and make your first
      purchase!
    </p>
    <a
      routerLink="/marketplace"
      class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-lg shadow transition-all"
      >Browse Marketplace</a
    >
  </div>
  } @else {
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    @for (order of orders; track order.id) {
    <button
      type="button"
      class="bg-blue-50 border border-blue-200 p-6 rounded-lg shadow-sm cursor-pointer hover:shadow-md transition-all flex flex-col justify-between min-h-[190px]"
      (click)="goToOrder(order.id)"
      (keydown.enter)="goToOrder(order.id)"
    >
      <div class="flex items-center justify-between mb-4">
        <span class="text-base font-semibold text-blue-900 tracking-wide"
          >Order # {{ order.id.slice(-10) }}</span
        >
        <span class="text-sm text-gray-400">{{
          order.createdAt | date : "mediumDate"
        }}</span>
      </div>
      <div class="space-y-1 mb-4">
        <div class="text-sm text-gray-700">
          <span
            >Ship to:
            <span class="font-medium"
              >{{ order.orderShipmentAddress.street }},
              {{ order.orderShipmentAddress.city }}</span
            ></span
          >
        </div>
        <div class="text-sm text-gray-700">
          <span
            >Items:
            <span class="font-medium">{{ order.orderItems.length }}</span> -
            <ng-container
              *ngFor="let item of order.orderItems; let last = last"
            >
              {{ item.postTitle }}<span *ngIf="!last">, </span>
            </ng-container>
          </span>
        </div>
      </div>
      <div class="flex items-center justify-between mt-auto pt-2">
        <span class="text-base font-semibold text-blue-600">
          @if (order.statusTimeline?.length) {
          {{ order.statusTimeline[order.statusTimeline.length - 1].status }}
          }
        </span>
        <span class="text-xl font-extrabold text-blue-900"
          >EGP{{ order.totalAmount }}</span
        >
      </div>
      <div *ngIf="order.isReviewed" class="mt-3">
        <span
          class="inline-block bg-green-100 text-green-800 text-xs px-2 py-1 rounded"
          >Reviewed</span
        >
      </div>
    </button>
    }
  </div>
  }
</div>
}
